<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Information</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url('g061u5vop91f1.gif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
    }

    #content {
      opacity: 0;
      transition: opacity 3s;
      margin-top: 50px;
    }

    .card {
      border: 2px solid #333;
      border-radius: 10px;
      width: 500px;
      margin: 20px auto;
      padding: 15px;
      background-color: rgba(255,255,255,0.9);
    }

    .card img {
      max-width: 100%;
      height: auto;
    }

    .card h1 {
      color: black;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div id="content">
  <div class="card">
    <h1>Job Application</h1>
    <p>Tên: Phan Đức Huy</p>
    <p>Sinh: 02/10/2010</p>
    <p>Quê quán: Bà Rịa Vũng Tàu</p>
    <p>Rất đẹp trai và lụy nyc</p>
    <a href="https://www.facebook.com/share/1DXsm91z2Q/?mibextid=wwXIfr">Facebook</a>
  </div>

  <div class="card">
    <img src="a1.img.png" alt="Image">
  </div>
</div>

<script>
  window.addEventListener('load', () => {
    document.getElementById('content').style.opacity = '1';
  });
</script>

</body>
</html>
